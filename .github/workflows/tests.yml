
name: StockFlow API - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockflow_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stockflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow_user -d stockflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://stockflow_user:test_password@localhost:5432/stockflow_db
      TEST_DATABASE_URL: postgresql+psycopg://stockflow_user:test_password@localhost:5432/stockflow_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U stockflow_user -d postgres \
            -c "CREATE DATABASE stockflow_test_db;"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
